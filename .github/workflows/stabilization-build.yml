name: BayBrain Stabilization Build

on:
  push:
    branches:
      - "stabilization/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (.NET 8 / Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore BayBrain.Tests/BayBrain.Tests.csproj

      - name: Build desktop application
        run: dotnet build BayBrain.csproj --configuration Release --no-restore

      - name: Run regression tests
        run: dotnet test BayBrain.Tests/BayBrain.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=stabilization-tests.trx"
